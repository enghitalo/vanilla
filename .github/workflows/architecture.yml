name: Architecture

# Two invariants from the #122 restructure (docs/ARCHITECTURE.md):
#   1. the one-direction dependency rule between top-level modules, and
#   2. the external-consumer import convention (`import vanilla.server`)
#      that `v install` users rely on.
# And one from CHECKLIST #42: a module whose public API is fully documented
# stays so (pull requests only: it compares with the base). And one from #383:
# every `fn C.` declaration of a C function returns the same type, since V
# types all of a program's calls to it by one of them.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a pull request cancels that PR's run still in progress, so
# superseded commits don't queue for the account's runners; on main every
# commit is its own group and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-direction:
    runs-on: ubuntu-latest
    name: dependency direction (grep)
    steps:
      - uses: actions/checkout@v4
      - name: Enforce one-direction dependency rule
        run: sh scripts/check_dependency_direction.sh

  c-fn-decls:
    runs-on: ubuntu-latest
    name: C declarations agree (grep)
    steps:
      - uses: actions/checkout@v4
      - name: One return type per C function (#383)
        run: sh scripts/check_c_fn_decls.sh

  doc-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: doc coverage (fully documented modules stay so)
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Modules at 100% stay there
        run: sh scripts/doc_coverage_gate.sh "$BASE_SHA"

  external-consumer:
    runs-on: ubuntu-latest
    name: synthetic external consumer (import vanilla.server)
    steps:
      - uses: actions/checkout@v4
      - name: Set up V
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version
          clean: false # cleaning races ::add-matcher:: (vlang/setup-v#118, #370)
      - name: Remove Vlang folder to avoid conflicts
        shell: bash
        run: |
          rm -rf -v ./vlang || true
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-libc-dev
      - name: Install checkout as ~/.vmodules/vanilla
        shell: bash
        run: |
          mkdir -p ~/.vmodules
          cp -r "$PWD" ~/.vmodules/vanilla
      # A hello-world OUTSIDE the repo tree, importing through the `vanilla.`
      # prefix — this is the layout a `v install` user gets, and it also
      # proves the in-repo bare imports (`import core`, `import socket`)
      # resolve from inside ~/.vmodules/vanilla.
      - name: Compile and run the consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > main.v <<'EOF'
          import vanilla.server
          import vanilla.core
          import vanilla.http1_1.response
          import vanilla.http1_1.request_parser
          import vanilla.http1_1.upstream

          fn handle(req []u8, mut res []u8, client_fd int, worker_state voidptr, mut event_loop core.EventLoop) core.Step {
          	request_parser.decode_http_request(req) or {
          		res << response.tiny_bad_request_response
          		return .close
          	}
          	res << 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: keep-alive\r\n\r\nok'.bytes()
          	return .done
          }

          fn main() {
          	mut srv := server.new_server(server.ServerConfig{
          		port:    0 // ephemeral — bind proves socket/, core/, http1_1/ all resolved
          		handler: handle
          	})!
          	println('external consumer resolves vanilla.server — ephemeral port ${srv.port} bound')
          	srv.shutdown(0)
          	// The pooled upstream client (#229) builds from outside the tree too
          	// (its C shim through @VMODROOT); an IP-literal origin needs no DNS.
          	mut pool := upstream.Pool.new(upstream.Origin{
          		host:  '127.0.0.1'
          		port:  9
          		https: false
          	}, unsafe { nil })!
          	pool.close()
          }
          EOF
          v -cc gcc -no-parallel -o consumer main.v
          ./consumer
          # #189: the io_uring backend drives the ring through the raw syscalls,
          # so no build needs liburing (not installed above) or links it.
          ldd consumer | tee ldd.txt
          if grep -q liburing ldd.txt; then
            echo "::error::the consumer links liburing"; exit 1
          fi
