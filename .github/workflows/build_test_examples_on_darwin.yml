name: (MacOS) Build & Test Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `brew update` re-syncs every tap on each job (~20s) and is a network flake
# waiting to happen — a run died here on `curl: (28) Operation too slow`
# fetching the formula index, in the `etag` job that needs no brew deps at all.
# So: never `brew update`, disable brew's implicit auto-update/cleanup, and
# install a formula only in the one job that actually needs it (below).
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1

# A new push to a pull request cancels that PR's run still in progress, so
# superseded commits don't queue for the account's runners; on main every
# commit is its own group and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples-building-and-testing:
    runs-on: macos-latest
    name: ${{ matrix.folder }}
    timeout-minutes: 20 # backstop for a hung vtest e2e test (no client timeouts)
    strategy:
      fail-fast: false # Continue other jobs if one fails
      matrix:
        folder:
          # async_watch_hangup (on_worker_start) and efficient_date (a hard-coded
          # `io_multiplexing: .epoll`) are Linux-only: they run in the Linux lane.
          - examples/async_pipe/src
          - examples/auth/src # its argon2-offload e2e test is Linux-only (vtest build: linux)
          - examples/chunked_streaming/src
          - examples/compression/src
          - examples/conformance/src
          - examples/cookies_sessions/src
          - examples/csrf/src
          - examples/database/src
          - examples/date_header/src
          - examples/etag/src
          - examples/hexagonal/src
          - examples/io_uring_demo/src
          - examples/ip_block/src
          - examples/middleware/src
          - examples/observability/src
          - examples/proxy_aware/src
          - examples/redirects/src
          - examples/router/src
          - examples/security_headers/src
          # - examples/simple/src
          - examples/simple2/src
          - examples/simple3/src
          - examples/spa_static_assets/src
          - examples/sse/src
          - examples/static_files/src
          - examples/tiny/src
          - examples/url_form/src
          - examples/veb_like/src
          - examples/video_stream/src # no V4L2 on macOS: /webcam reports unavailable, and the tests never touch the camera
    steps:
      - uses: actions/checkout@v4
      # Cache the V toolchain so setup-v restores a prebuilt compiler instead of
      # rebuilding V from source (make fresh_vc/fresh_tcc, ~40s) on every job.
      - name: Cache V toolchain
        uses: actions/cache@v4
        with:
          path: ~/hostedtoolcache/v
          key: v-toolchain-${{ runner.os }}-${{ runner.arch }}
      - name: Set up V
        uses: vlang/setup-v@v1.7
        with:
          clean: false
      - name: Remove Vlang folder to avoid conflicts
        shell: bash
        run: |
          rm -rf -v ./vlang || true

      # brotli: compress.brotli dlopens /opt/homebrew/lib/libbrotli{enc,dec}.dylib,
      # so the compression example exercises the `br` path for real. Only this job
      # needs it — the others skip brew entirely.
      - name: Install brotli (compression only)
        if: matrix.folder == 'examples/compression/src'
        shell: bash
        run: brew install brotli
      # sqlite3: hexagonal links against it for its user repository, simple3
      # for its connection pool.
      - name: Install sqlite3 (hexagonal and simple3 only)
        if: matrix.folder == 'examples/hexagonal/src' || matrix.folder == 'examples/simple3/src'
        shell: bash
        run: brew install sqlite3
      - name: Build ${{ matrix.folder }}
        shell: bash
        run: |
          v $(pwd)/${{ matrix.folder }}
      - name: Test ${{ matrix.folder }}
        shell: bash
        run: |
          v test $(pwd)/${{ matrix.folder }}
