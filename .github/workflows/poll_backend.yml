name: Poll Backend (portability floor)

# Exercises the pure-POSIX poll(2) reactor (server/backend_poll/, issue #122
# step 4) on Linux CI: the same behaviour suite the other backends pass, with
# `-d vanilla_poll` swapping the reactor in. Zero hosted RTOS hardware needed
# — this is the QNX/VxWorks floor running under a Linux kernel. Normal builds
# never compile backend_poll (the import lives in a _d_vanilla_poll file), so
# this job is the only place the flag is on.

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'poll/**'
      - 'core/**'
      - 'http1_1/**'
      - 'socket/**'
      - 'vtest/**'
      - 'transport/**'
      - 'tests/**'
      - '.github/workflows/poll_backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'poll/**'
      - 'core/**'
      - 'http1_1/**'
      - 'socket/**'
      - 'vtest/**'
      - 'transport/**'
      - 'tests/**'
      - '.github/workflows/poll_backend.yml'

# A new push to a pull request cancels that PR's run still in progress, so
# superseded commits don't queue for the account's runners; on main every
# commit is its own group and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  poll-reactor-tests:
    runs-on: ubuntu-latest
    name: behaviour suite under -d vanilla_poll
    timeout-minutes: 20 # backstop for a hung vtest e2e test (no client timeouts)
    steps:
      - uses: actions/checkout@v4
      - name: Set up V
        uses: vlang/setup-v@v1.7
      - name: Remove Vlang folder to avoid conflicts
        shell: bash
        run: |
          rm -rf -v ./vlang || true
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-libc-dev
      # The whole behaviour suite (pipelining, split framing, max_connections,
      # read timeout, connection reaping, large-body drain, half-close,
      # 100-continue, graceful shutdown) runs against .poll via the $if vanilla_poll ? test fns, with
      # the epoll checks as the in-binary control group. VANILLA_NO_IOURING is
      # the repo's own kill-switch for exactly this host class (see
      # iou_backend_available): hosted runners cap io_uring so a probe that
      # passes at time T still sees worker N's ring init fail a moment later
      # ("io_uring_queue_init_params failed for all ring entry/flag
      # combinations" — runs 1 and 2 of this job, in both the parallel-binary
      # and single-binary shapes). io_uring is not this job's subject; its
      # coverage gates in conformance_h1spec.yml.
      - name: Behaviour suite with the poll reactor
        shell: bash
        env:
          VANILLA_NO_IOURING: '1'
        run: |
          v -cc gcc -no-parallel -d vanilla_poll test tests/backend_behaviors_test.v
      # The reaping edge cases that need no watch reactor (fresh deadline for a
      # pipelined partial, no 408 inside a pending response, the stalled-upload
      # 408, 100-continue and streamed uploads under deadlines, a connect storm)
      # have test_poll_* twins in epoll_timeouts_test.v.
      - name: Reaping edge cases with the poll reactor
        shell: bash
        env:
          VANILLA_NO_IOURING: '1'
        run: |
          v -cc gcc -no-parallel -d vanilla_poll -run-only 'test_poll_*' test tests/epoll_timeouts_test.v
      # Out of fds, accept() fails with EMFILE: every worker must pause
      # accepting instead of polling a listener that stays readable (#256).
      - name: Accept pause when out of fds, with the poll reactor
        shell: bash
        env:
          VANILLA_NO_IOURING: '1'
        run: |
          v -cc gcc -no-parallel -d vanilla_poll -run-only 'test_poll_*' test tests/accept_starved_test.v
      # Once the listener's number names another file, every worker must stop
      # accepting instead of polling it readable for good (#163).
      - name: Accept stop when the listener is gone, with the poll reactor
        shell: bash
        env:
          VANILLA_NO_IOURING: '1'
        run: |
          v -cc gcc -no-parallel -d vanilla_poll -run-only 'test_poll_*' test tests/listener_gone_test.v
      # A flag-on example build proves the -d wiring links outside tests too.
      - name: Build an example with -d vanilla_poll
        shell: bash
        run: |
          v -cc gcc -no-parallel -d vanilla_poll -o /tmp/simple_poll examples/simple/src
